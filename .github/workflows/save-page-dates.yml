name: Save page dates
# After each change to the site, records which pages really changed (and on what day) in
# src/data/page-dates.json, so the sitemap and "Updated" dates only move when a page's words do.
on:
  push:
    branches: [main]
    paths:
      - "build.mjs"
      - "src/**"
      - "!src/data/page-dates.json"
  workflow_dispatch:
concurrency: save-page-dates
permissions:
  contents: write
jobs:
  dates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .node-version }
      - name: Update the dates file
        run: node build.mjs --update-dates
      - name: Save it if anything changed
        run: |
          git config user.name "homegrown-plate-bot"; git config user.email "actions@users.noreply.github.com"
          git add src/data/page-dates.json
          if git diff --cached --quiet; then echo "No page changed"; exit 0; fi
          git commit -qm "Save page dates [skip ci]"
          git pull -q --rebase origin main && git push -q origin HEAD:main
