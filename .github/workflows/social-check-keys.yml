name: Social - check keys
# Run by hand after adding keys. Checks Buffer, Gemini and Drive and saves what it finds.
on: workflow_dispatch
permissions:
  contents: write
  id-token: write
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: social
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: social }
      - uses: actions/checkout@v4
        with: { ref: social-data, path: social/data }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q requests google-auth
      - name: Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python scripts/check_keys.py buffer
      - name: Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/check_keys.py gemini
      - name: Sign in to Google (keyless, read-only Drive)
        id: gauth
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/777311628580/locations/global/workloadIdentityPools/github/providers/homegrown-plate
          service_account: homegrown-playe-drive@project-9cb4a1e7-00fd-4f37-938.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly
          access_token_lifetime: 3600s
      - name: Drive
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.gauth.outputs.access_token }}
        run: python scripts/check_keys.py drive
      - name: Save
        working-directory: social/data
        run: |
          git config user.name "homegrown-plate-bot"; git config user.email "actions@users.noreply.github.com"
          git add -A && (git commit -qm "Key check" && git push -q origin HEAD:social-data) || true
