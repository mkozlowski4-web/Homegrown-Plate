name: Social - daily Buffer top-up
# Buffer's free plan holds 10 scheduled posts per channel, so posts are sent a few days ahead, every morning.
on:
  schedule:
    - cron: "15 7 * * *"
  workflow_dispatch:
concurrency: social-autopilot
permissions:
  contents: write
jobs:
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: social
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: social }
      - uses: actions/checkout@v4
        with: { ref: social-data, path: social/data }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q requests
      - name: Send posts due in the next few days
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          PINTEREST_BOARD: ${{ vars.PINTEREST_BOARD }}
        run: python run.py queue
      - name: Save
        working-directory: social/data
        run: |
          git config user.name "homegrown-plate-bot"; git config user.email "actions@users.noreply.github.com"
          git add -A && (git commit -qm "Daily queue" && git push -q origin HEAD:social-data) || echo "nothing new"
