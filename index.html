<title>Homegrown Plate</title>
<style>

  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--cream); line-height: 1.6; }
  header { background: var(--green); color: #fff; position: sticky; top: 0; z-index: 10; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 20px; }
  .brand { font-size: 1.5rem; font-weight: 800; padding: 16px 0 8px; }
  .brand span { color: #b7e4c7; }
  nav { display: flex; flex-wrap: wrap; gap: 4px; padding-bottom: 10px; }
  nav a { color: #e9f5ee; text-decoration: none; padding: 6px 12px; border-radius: 999px; font-size: .95rem; }
  nav a:hover, nav a.active { background: rgba(255,255,255,.18); color: #fff; }
  main { padding: 32px 0 60px; min-height: 70vh; }
  h1 { font-size: 2.1rem; margin: 0 0 8px; color: var(--green); }
  h2 { font-size: 1.5rem; color: var(--green); margin-top: 32px; }
  h3 { margin: 0 0 6px; font-size: 1.15rem; }
  p.lead { font-size: 1.1rem; color: var(--muted); max-width: 720px; }
  .hero { background: linear-gradient(135deg, #2d6a4f, #52b788); color: #fff; border-radius: 18px; padding: 48px 32px; }
  .hero h1 { color: #fff; font-size: 2.6rem; }
  .hero p { color: #e8f5ee; font-size: 1.15rem; max-width: 640px; }
  .btn { display: inline-block; background: #fff; color: var(--green); padding: 10px 18px; border-radius: 10px; text-decoration: none; font-weight: 700; margin-top: 10px; }
  .grid { display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); margin-top: 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; box-shadow: 0 2px 6px rgba(0,0,0,.03); }
  .card a { color: var(--green); font-weight: 600; }
  .emoji { font-size: 2rem; }
  .tag { display: inline-block; font-size: .78rem; background: #e6f4ec; color: var(--green); padding: 2px 9px; border-radius: 999px; margin: 2px 4px 2px 0; }
  .tag.warm { background: #fbe9d7; color: #8a4b12; }
  .tag.red { background: #f9dfe3; color: #8e1d2f; }
  ul.tips li { margin-bottom: 6px; }
  .info-row { display: grid; grid-template-columns: 150px 1fr; gap: 6px 14px; margin: 14px 0; }
  .info-row div:nth-child(odd) { font-weight: 700; color: var(--soil); }
  input[type=search], select {
    width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; font-size: 1rem; background: #fff; margin-top: 8px;
  }
  .filters { display: grid; gap: 12px; grid-template-columns: 2fr 1fr; }
  @media (max-width: 640px) { .filters { grid-template-columns: 1fr; } .info-row { grid-template-columns: 1fr; } .hero h1 { font-size: 2rem; } }
  .size-card { border-top: 5px solid var(--leaf); }
  .size-card.s2 { border-top-color: #95d5b2; }
  .size-card.s3 { border-top-color: #2d6a4f; }
  .size-card.s4 { border-top-color: var(--soil); }
  .step { display: flex; gap: 14px; margin-bottom: 14px; }
  .step .num { flex: 0 0 36px; height: 36px; border-radius: 50%; background: var(--green); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; }
  .ing-have { color: var(--green); font-weight: 700; }
  .ing-need { color: var(--muted); }
  .recipe-steps ol { padding-left: 20px; }
  .recipe-steps li { margin-bottom: 8px; }
  .back { display: inline-block; margin-bottom: 14px; color: var(--green); text-decoration: none; font-weight: 600; }
  .cal-wrap { overflow-x: auto; margin-top: 16px; background: #fff; border: 1px solid var(--line); border-radius: 14px; }
  table.cal { border-collapse: collapse; width: 100%; min-width: 760px; font-size: .85rem; }
  table.cal th, table.cal td { border: 1px solid var(--line); padding: 6px 4px; text-align: center; }
  table.cal thead th { background: var(--green); color: #fff; font-weight: 600; }
  table.cal thead th.now { background: var(--soil); }
  table.cal tbody th { text-align: left; padding-left: 10px; font-weight: 600; white-space: nowrap; background: #f6f9f5; }
  table.cal tbody th a { color: var(--green); text-decoration: none; }
  table.cal td { min-width: 40px; }
  .bar { display: block; height: 8px; border-radius: 4px; margin: 3px 4px; }
  .bar.ind { background: #8ecae6; }
  .bar.out { background: #52b788; }
  .bar.har { background: #f4a261; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; margin: 14px 0 4px; font-size: .92rem; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { display: inline-block; width: 22px; height: 8px; border-radius: 4px; }
  footer { background: #1f2a24; color: #cfd8d2; padding: 24px 0; font-size: .9rem; }
  .muted { color: var(--muted); }
  .empty { padding: 24px; text-align: center; color: var(--muted); }
</style>

function pageCalendar(size = "all") {
  const now = new Date().getMonth();
  const list = PLANTS.filter(p => size === "all" || p.sizes.includes(size));
  const empty = "0".repeat(12);
  const head = MONTHS.map((m, i) => `<th class="${i === now ? "now" : ""}">${m}</th>`).join("");
  const rows = list.map(p => {
    const c = CALENDAR[p.id] || { i: empty, o: empty, h: empty };
    const cells = MONTHS.map((_, m) =>
      `<td>${c.i[m] === "1" ? '<span class="bar ind" title="Sow indoors"></span>' : ""}${c.o[m] === "1" ? '<span class="bar out" title="Sow or plant outside"></span>' : ""}${c.h[m] === "1" ? '<span class="bar har" title="Harvest"></span>' : ""}</td>`
    ).join("");
    return `<tr><th scope="row"><a href="#/plants/${p.id}">${p.emoji} ${p.name}</a></th>${cells}</tr>`;
  }).join("");
  return `
    <h1>Planting Calendar</h1>
    <p class="lead">When to plant indoors, plant or sow outside, and harvest, month by month. Based on typical UK timings; the current month is highlighted.</p>
    <div class="legend">
      <span><i style="background:#8ecae6"></i>Plant indoors</span>
      <span><i style="background:#52b788"></i>Sow or plant outside</span>
      <span><i style="background:#f4a261"></i>Harvest</span>
    </div>
    <div class="filters">
      <div></div>
      <div>
        <select id="calSize">
          <option value="all">All garden sizes</option>
          ${SIZES.map(s => `<option value="${s.id}" ${s.id === size ? "selected" : ""}>${s.title}</option>`).join("")}
        </select>
      </div>
    </div>
    <div class="cal-wrap">
      <table class="cal">
        <thead><tr><th>Crop</th>${head}</tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <p class="muted" style="font-size:.9rem;margin-top:14px">Timings vary by region, frost dates and variety. Check the Plant Guide for details on each crop.</p>`;
}

function pageNotFound() {
  return `<h1>Page not found</h1><p><a href="#/">Go home</a></p>`;
}

/* ============ ROUTER ============ */
function route() {
  const hash = location.hash.replace(/^#\/?/, "");
  const [section, sub] = hash.split("/");
  let html;
  let active = section || "home";

  switch (section) {
    case "": html = pageHome(); active = "home"; break;
    case "sizes": html = sub ? pageSizeDetail(sub) : pageSizes(); break;
    case "plants": html = sub ? pagePlantDetail(sub) : pagePlants(); break;
    case "howto": html = pageHowTo(); break;
    case "calendar": html = pageCalendar(); break;
    case "harvest": html = pageHarvest(); break;
    case "recipes": html = sub ? pageRecipeDetail(sub) : pageRecipes(); break;
    default: html = pageNotFound(); active = "";
  }

  $("#app").innerHTML = html;
  document.querySelectorAll("#nav a").forEach(a => a.classList.toggle("active", a.dataset.route === active));
  window.scrollTo(0, 0);
  bindFilters();
}

function bindFilters() {
  const search = $("#plantSearch");
  const sizeSel = $("#plantSize");
  if (search && sizeSel) {
    const apply = () => {
      const q = search.value.trim();
      const s = sizeSel.value;
      history.replaceState(null, "", `#/plants${s !== "all" || q ? "" : ""}`);
      $("#app").innerHTML = pagePlants(q, s);
      bindFilters();
      const newSearch = $("#plantSearch");
      newSearch.focus();
      newSearch.setSelectionRange(q.length, q.length);
    };
    search.addEventListener("input", apply);
    sizeSel.addEventListener("change", () => { search.value = search.value; apply(); });
  }
  const calSel = $("#calSize");
  if (calSel) calSel.addEventListener("change", () => {
    $("#app").innerHTML = pageCalendar(calSel.value);
    bindFilters();
  });
  const rf = $("#recipeFilter");
  if (rf) rf.addEventListener("change", () => {
    $("#app").innerHTML = pageRecipes(rf.value);
    bindFilters();
  });
}

window.addEventListener("hashchange", route);
route();
