<!doctype html><html><head><meta charset="utf-8"><style>{% include 'base.css' %}
.img { position: absolute; left: 0; right: 0; top: 0; height: 900px; }
.panel { position: absolute; left: 0; right: 0; bottom: 0; top: 860px; background: var(--cream); border-radius: 44px 44px 0 0; padding: 50px 60px; }
h1 { font-family: "HP Serif"; font-weight: 700; font-size: {{ size or 76 }}px; line-height: 1.04; margin: 22px 0 18px; }
.sub { font-size: 32px; color: var(--muted); line-height: 1.35; }
.foot { position: absolute; left: 60px; right: 60px; bottom: 44px; display: flex; justify-content: space-between; align-items: center; }
</style></head><body>
<div class="img {{ img_class }}" style="background-image:url('{{ image }}')"></div>
<div class="panel">
  <span class="pill {{ pill_class or '' }}">{{ kicker }}</span>
  <h1>{{ title }}</h1>
  {% if sub %}<div class="sub">{{ sub }}</div>{% endif %}
</div>
<div class="foot"><div class="brand"><img src="{{ logo }}">Homegrown Plate</div><span class="url">homegrownplate.co.uk</span></div>
</body></html>
